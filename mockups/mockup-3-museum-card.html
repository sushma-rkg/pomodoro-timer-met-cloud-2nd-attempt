<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup 3 – Museum Card</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f0f0;
      padding: 32px 16px 48px;
    }

    .page-label {
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 6px;
    }
    .page-name {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 40px;
    }

    .views {
      display: flex;
      gap: 28px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .view {
      flex: 1;
      min-width: 300px;
      max-width: 440px;
    }
    .view-label {
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 14px;
    }

    /* ── App shell ── */
    .app {
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.10);
      padding: 28px 22px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .app-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #1a1a1a;
      margin-bottom: 20px;
    }

    /* ── Coral accent line above panel ── */
    .accent-line {
      width: 100%;
      height: 3px;
      background: #E8735A;
      border-radius: 2px 2px 0 0;
    }

    /* ── Painting panel — framed ── */
    .panel {
      width: 100%;
      height: 260px;
      background: #000;
      border-left: 1px solid #1a1a1a;
      border-right: 1px solid #1a1a1a;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .panel img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .panel img.blurred {
      filter: blur(20px);
      transform: scale(1.08);
    }

    /* ── Control bar — slim strip below the frame ── */
    .control-bar {
      width: 100%;
      border: 1px solid #1a1a1a;
      border-top: none;
      border-radius: 0 0 4px 4px;
      display: flex;
      align-items: center;
      padding: 10px 14px;
      gap: 12px;
      margin-bottom: 20px;
    }
    .timer {
      font-size: 12px;
      color: #aaa;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      flex: 1;
    }
    .btn {
      padding: 7px 18px;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 600;
      cursor: default;
      border: none;
    }
    .btn-start {
      background: #E8735A;
      color: #fff;
    }
    .btn-reset {
      background: transparent;
      color: #aaa;
      border: 1px solid #ddd;
    }

    /* ── Reveal box ── */
    .reveal {
      width: 100%;
      border-top: 3px solid #E8735A;
      border-radius: 0 0 6px 6px;
      border-left: 1px solid #e8e8e8;
      border-right: 1px solid #e8e8e8;
      border-bottom: 1px solid #e8e8e8;
      padding: 16px 18px;
      background: #fff;
    }
    .reveal-title {
      font-size: 15px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 4px;
    }
    .reveal-meta {
      font-size: 12px;
      color: #888;
      margin-bottom: 10px;
    }
    .reveal-link {
      font-size: 12px;
      color: #E8735A;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <p class="page-label">Design Direction</p>
  <h1 class="page-name">3 – Museum Card</h1>

  <div class="views">

    <div class="view">
      <p class="view-label">While the timer runs</p>
      <div class="app">
        <span class="app-title">Pomodoro Art</span>
        <div class="accent-line"></div>
        <div class="panel">
          <img class="blurred" src="https://images.metmuseum.org/CRDImages/ep/original/DP-29324-001.jpg" alt="Painting loading…">
        </div>
        <div class="control-bar">
          <span class="timer">24:32</span>
          <button class="btn btn-start">Pause</button>
          <button class="btn btn-reset">Reset</button>
        </div>
      </div>
    </div>

    <div class="view">
      <p class="view-label">When the timer ends</p>
      <div class="app">
        <span class="app-title">Pomodoro Art</span>
        <div class="accent-line"></div>
        <div class="panel">
          <img src="https://images.metmuseum.org/CRDImages/ep/original/DP-29324-001.jpg" alt="The Abduction of the Sabine Women">
        </div>
        <div class="control-bar">
          <span class="timer">00:00</span>
          <button class="btn btn-start">Start</button>
          <button class="btn btn-reset">Reset</button>
        </div>
        <div class="reveal">
          <p class="reveal-title">The Abduction of the Sabine Women</p>
          <p class="reveal-meta">Nicolas Poussin &nbsp;·&nbsp; probably 1633–34</p>
          <a class="reveal-link" href="#">View on the Met Museum →</a>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
